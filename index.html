<!-- Approved seller product form -->
<div class="modal" id="productModal" role="dialog" aria-modal="true">
  <div class="modal-card">
    <button class="close" onclick="closeModal('productModal')" aria-label="Close">&times;</button>
    <h2>Add a festival product</h2>
    <p>Your product will be saved to the Sellora marketplace.</p>

    <form id="productForm">
      <div class="field">
        <label for="listingName">Product name</label>
        <input id="listingName" required maxlength="120">
      </div>
      <div class="field">
        <label for="listingDescription">Description</label>
        <textarea id="listingDescription" required maxlength="1000"></textarea>
      </div>
      <div class="field">
        <label for="listingPrice">Price in ₹</label>
        <input id="listingPrice" type="number" min="0.01" step="0.01" required>
      </div>
      <div class="field">
        <label for="listingCategory">Category</label>
        <input id="listingCategory" required maxlength="80" placeholder="e.g. Home Decor">
      </div>
      <div class="field">
        <label for="listingFestival">Festival</label>
        <select id="listingFestival" required>
          <option value="Diwali">Diwali</option>
          <option value="Holi">Holi</option>
          <option value="Ganesh Chaturthi">Ganesh Chaturthi</option>
          <option value="Raksha Bandhan">Raksha Bandhan</option>
          <option value="Navratri">Navratri</option>
          <option value="Durga Puja">Durga Puja</option>
          <option value="Eid">Eid</option>
          <option value="Christmas">Christmas</option>
          <option value="Pongal">Pongal</option>
          <option value="Onam">Onam</option>
          <option value="Janmashtami">Janmashtami</option>
          <option value="Makar Sankranti">Makar Sankranti</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="field">
        <label for="listingImage">Product image URL (optional)</label>
        <input id="listingImage" type="url" placeholder="https://example.com/product.jpg">
      </div>
      <div class="field">
        <label for="listingStock">Available quantity</label>
        <input id="listingStock" type="number" min="0" step="1" value="10" required>
      </div>
      <button class="btn btn-primary" type="submit" id="productSubmit">
        Publish product
      </button>
    </form>
    <div class="form-message" id="productMessage" aria-live="polite"></div>
  </div>
</div>
